[workspace]
resolver = "2"
members = ["rust/crates/keel", "rust/crates/keel-platform", "rust/crates/keel-releaseassets", "rust/crates/keel-professionaltext", "rust/crates/keel-flow"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"
license = "MIT"
repository = "https://github.com/UntaDotMy/keel"

[workspace.dependencies]
keel-platform = { path = "rust/crates/keel-platform" }
keel-releaseassets = { path = "rust/crates/keel-releaseassets" }
keel-professionaltext = { path = "rust/crates/keel-professionaltext" }
keel-flow = { path = "rust/crates/keel-flow" }
regex = "1.11"
rusqlite = { version = "0.37.0", features = ["bundled"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = { version = "1.0.140", features = ["preserve_order"] }
tiktoken-rs = "0.11.0"
toml = "=0.9.6"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = "symbols"
