# Purpose: Keep tracked Rust, OpenCode, and GitHub Actions dependencies current. Caller: GitHub Dependabot.
# Dependencies: Cargo.lock, opencode/package.json, and workflow action references. Side Effects: Opens validated update pull requests.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
    # These releases resolve dependencies that require Rust 1.85; the workspace MSRV is 1.80.
    ignore:
      - dependency-name: serde_spanned
        versions:
          - ">= 1.1.0"
      - dependency-name: toml_parser
        versions:
          - ">= 1.1.0"
      - dependency-name: toml_writer
        versions:
          - ">= 1.1.0"
      - dependency-name: assert_cmd
        versions:
          - ">= 2.1.3"
      - dependency-name: rusqlite
        versions:
          - ">= 0.33.0"
      - dependency-name: toml
        versions:
          - ">= 0.9.7"
  - package-ecosystem: npm
    directory: /opencode
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 10
