name: Mutation Testing

# Scheduled mutation test runs for high-risk subsystems:
# proxy, MCP, planner, research, tickets, warnings, and review gates.

permissions:
  contents: read

on:
  schedule:
    # Run weekly on Mondays at 03:00 UTC
    - cron: '0 3 * * 1'
  workflow_dispatch:

concurrency:
  group: mutation-test-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: "0"

jobs:
  mutants:
    name: Mutation Testing (High-Risk Paths)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: mutants-cache
      - name: Install cargo-mutants
        uses: taiki-e/install-action@84f5ac3124727fb3d284d4d22ee9ab3654fd09a6 # v2.87.7
        with:
          tool: cargo-mutants
      - name: Run mutation testing on high-risk paths
        id: run-mutants
        shell: bash
        run: |
          set +e
          cargo mutants \
            --file .cargo/mutants.toml \
            --in-place \
            --no-shuffle \
            --output "$RUNNER_TEMP/mutants.out" \
            2>&1 | tee "$RUNNER_TEMP/cargo-mutants.log"
          cargo_exit_code="${PIPESTATUS[0]}"
          set -e
          echo "exit_code=$cargo_exit_code" >> "$GITHUB_OUTPUT"
          echo "cargo-mutants exit code: $cargo_exit_code"
          # Exit code 2 means missed mutants, which the comparator evaluates
          # against the tracked threshold; any other non-zero code is a harness failure.
      - name: Verify mutation baseline regression
        if: always()
        env:
          CARGO_MUTANTS_EXIT_CODE: ${{ steps.run-mutants.outputs.exit_code }}
        run: |
          node .github/compare-mutation-baseline.mjs \
            --baseline docs/quality/mutation-baseline.json \
            --results "$RUNNER_TEMP/mutants.out" \
            --report "$RUNNER_TEMP/mutation-baseline-comparison.json" \
            --cargo-exit-code "${CARGO_MUTANTS_EXIT_CODE:-}"
      - name: Upload mutation evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: mutation-testing-evidence
          path: |
            ${{ runner.temp }}/mutation-baseline-comparison.json
            ${{ runner.temp }}/cargo-mutants.log
            ${{ runner.temp }}/mutants.out/caught.txt
            ${{ runner.temp }}/mutants.out/missed.txt
            ${{ runner.temp }}/mutants.out/timeout.txt
            ${{ runner.temp }}/mutants.out/unviable.txt
          if-no-files-found: warn
