name: Validate

# PR + main quality gate. Release (artifacts) is a separate workflow.
#
# Path gating: full Rust matrix only when the change can affect the product or
# its parity tests. Docs-only / narrative-only PRs get a fast green gate instead
# of 3× cargo test matrices.
#
# Speed notes (2026-07 audit):
# - Prefer dev-profile tests: Cargo.toml [profile.release] uses thin LTO +
#   codegen-units=1, which makes --release CI several× slower without catching
#   extra correctness bugs that clippy + tests miss.
# - Drop a standalone `cargo build --release`; `cargo test` already compiles
#   what it needs. Release binaries stay the job of release.yml.
# - CARGO_INCREMENTAL=0 + CARGO_PROFILE_TEST_DEBUG=0 shrink cache/target.
# - cargo-audit via taiki-e/install-action (cached tool binary), not `cargo install`.
# - security-audit path filter: skip when lockfile/manifests unchanged on PRs.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  # Classify the diff so heavy jobs can no-op on docs-only work.
  # "code" = anything that can break the binary, install surface, skills/parity
  # tests, host adapters, or CI itself. Pure narrative docs (docs/**, audits,
  # most root *.md that are not CLAUDE/AGENTS/README skill surfaces) stay off.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          # On push to main, compare against the previous commit on the branch.
          # On pull_request, compare against the PR base (default).
          filters: |
            code:
              - 'rust/**'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'audit.toml'
              - 'build.rs'
              - '**/*.rs'
              - '.github/workflows/**'
              - 'install.sh'
              - 'install.ps1'
              - 'install.cmd'
              - '.claude-plugin/**'
              - '.claude/**'
              - '.lsp.json'
              - 'keel.filters.toml'
              - 'commands/**'
              - 'opencode/**'
              - 'codex/**'
              - 'cursor/**'
              - 'pi/**'
              - 'cowork/**'
              - 'commandcode/**'
              - 'statusline/**'
              - 'hermes-agent/**'
              - '_shared/**'
              - 'using-keel/**'
              - '**/SKILL.md'
              - '**/agents/**'
              - 'AGENTS.md'
              - 'AGENTS/**'
              - 'CLAUDE.md'
              - 'Claude.md'
              - 'Agents.md'
              - '00-skill-routing-and-escalation.md'
              - 'WORKFLOW.md'
              - 'README.md'
              - 'CONTRIBUTING.md'
              - 'SECURITY.md'
              - 'templates/**'
              - '.githooks/**'
              - 'Cargo.toml'
              - 'Cargo.lock'

  # Summary gate also waits for the adapter surface when product paths change.
  ci-gate:
    name: CI gate
    needs: [changes, validate-adapters]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Report scope
        run: |
          if [ "${{ needs.changes.outputs.code }}" = "true" ] \
            && [ "${{ needs.validate-adapters.result }}" != "success" ]; then
            echo "Adapter validation failed for a product change." >&2
            exit 1
          fi
          if [ "${{ needs.changes.outputs.code }}" = "true" ]; then
            echo "Code/product paths changed — full Validate matrix will run."
          else
            echo "No code/product paths changed — skipping cargo/clippy/test matrix."
            echo "Docs-only or non-product files only."
          fi

  validate-linux:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-on-failure: true
          key: validate-linux
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        # why: without --all-targets clippy skips test code, so lint failures in
        # tests reach main while CI stays green.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Check MSRV
        shell: bash
        run: |
          MSRV=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\([0-9.]*\)".*/\1/')
          if [ -z "$MSRV" ]; then
            echo "No rust-version set in Cargo.toml — skipping MSRV check."
            exit 0
          fi
          RUSTC_VERSION=$(rustc --version | awk '{print $2}')
          echo "Required MSRV: $MSRV"
          echo "Installed rustc: $RUSTC_VERSION"
          if printf '%s\n' "$MSRV" "$RUSTC_VERSION" | sort -V | head -n1 | grep -q "$MSRV"; then
            echo "MSRV check passed."
          else
            echo "::error::rustc $RUSTC_VERSION is below MSRV $MSRV"
            exit 1
          fi
      - name: Run tests
        run: cargo test --locked

  validate-windows:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-on-failure: true
          key: validate-windows
      - name: Lint
        # why: without --all-targets clippy skips test code, so lint failures in
        # tests reach main while CI stays green.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Check PowerShell statusline syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile(
            (Join-Path $PWD "statusline/statusline-keel.ps1"),
            [ref]$tokens,
            [ref]$errors
          ) | Out-Null
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

  validate-macos:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-on-failure: true
          key: validate-macos
      - name: Lint
        # why: without --all-targets clippy skips test code, so lint failures in
        # tests reach main while CI stays green.
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run tests
        run: cargo test --locked

  validate-adapters:
    name: validate-adapters
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: "1.4.0"
      - name: Check TypeScript adapter syntax
        run: |
          bun --check _shared/ts/bridge-core.ts
          bun --check pi/keel-pi.ts
          bun --check opencode/keel.ts
          bun --check codex/keel-codex.ts
          bun --check commandcode/keel-cmdc.ts
      - name: Check Unix statusline syntax
        run: bash -n statusline/statusline-keel.sh

  security-audit:
    needs: changes
    # Dep scan only when deps change (PR) or always when we already run code CI
    # on push to main with product changes. Pure docs PRs skip entirely.
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            deps:
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'audit.toml'
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        if: steps.filter.outputs.deps == 'true' || github.event_name != 'pull_request'
      - name: Install cargo-audit (cached tool binary)
        if: steps.filter.outputs.deps == 'true' || github.event_name != 'pull_request'
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        if: steps.filter.outputs.deps == 'true' || github.event_name != 'pull_request'
        run: cargo audit
      - name: Skip audit (no dependency changes on PR)
        if: steps.filter.outputs.deps != 'true' && github.event_name == 'pull_request'
        run: echo "No Cargo.toml/Cargo.lock/audit.toml changes — skipping cargo audit on this PR."
