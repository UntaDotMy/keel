name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Block direct pushes to main — enforce branch policy
  # Merge commits (from PR merges) have 2+ parents; direct pushes have 1
  branch-guard:
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Reject direct pushes to main
        run: |
          PARENTS=$(git cat-file -p HEAD | grep -c "^parent")
          if [ "$PARENTS" -lt 2 ]; then
            echo ""
            echo "❌ DIRECT PUSH TO MAIN BLOCKED"
            echo ""
            echo "Branch policy requires: work branch → feat → dev → main"
            echo "Direct pushes are never allowed on main."
            echo ""
            echo "Create a work branch and PR instead:"
            echo "  git checkout -b <category>/<FEATURE>"
            echo "  git push origin <category>/<FEATURE>"
            echo "  gh pr create --base feat"
            exit 1
          fi
          echo "✅ Merge commit detected — allowing."

  validate-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-on-failure: true
          key: validate-linux
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy -- -D warnings
      - name: Check MSRV
        shell: bash
        run: |
          MSRV=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\([0-9.]*\)".*/\1/')
          if [ -z "$MSRV" ]; then
            echo "No rust-version set in Cargo.toml — skipping MSRV check."
            exit 0
          fi
          RUSTC_VERSION=$(rustc --version | awk '{print $2}')
          echo "Required MSRV: $MSRV"
          echo "Installed rustc: $RUSTC_VERSION"
          if printf '%s\n' "$MSRV" "$RUSTC_VERSION" | sort -V | head -n1 | grep -q "$MSRV"; then
            echo "MSRV check passed."
          else
            echo "::error::rustc $RUSTC_VERSION is below MSRV $MSRV"
            exit 1
          fi
      - name: Build
        run: cargo build --release
      - name: Run tests
        run: cargo test --release

  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-on-failure: true
          key: validate-windows
      - name: Lint
        run: cargo clippy -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Run tests
        run: cargo test --release

  validate-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-on-failure: true
          key: validate-macos
      - name: Lint
        run: cargo clippy -- -D warnings
      - name: Build
        run: cargo build --release
      - name: Run tests
        run: cargo test --release

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - name: Install cargo-audit
        run: cargo install cargo-audit
      - name: Run cargo audit
        run: cargo audit
