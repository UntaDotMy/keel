name: Validate

# PR + main quality gate. Release (artifacts) is a separate workflow and does
# not re-run this suite — only multi-target `cargo build --release` + publish.
# Speed notes (2026-07 audit):
# - Prefer dev-profile tests: Cargo.toml [profile.release] uses thin LTO +
#   codegen-units=1, which makes --release CI several× slower without catching
#   extra correctness bugs that clippy + tests miss.
# - Drop a standalone `cargo build --release`; `cargo test` already compiles
#   what it needs. Release binaries stay the job of release.yml.
# - CARGO_INCREMENTAL=0 + CARGO_PROFILE_TEST_DEBUG=0 shrink cache/target (corrode.dev).
# - cargo-audit via taiki-e/install-action (cached tool binary), not `cargo install`.
# - security-audit path filter: skip when lockfile/manifests unchanged.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: "0"
  CARGO_PROFILE_TEST_DEBUG: "0"

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-on-failure: true
          key: validate-linux
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Lint
        run: cargo clippy --locked -- -D warnings
      - name: Check MSRV
        shell: bash
        run: |
          MSRV=$(grep -m1 '^rust-version' Cargo.toml | sed 's/.*"\([0-9.]*\)".*/\1/')
          if [ -z "$MSRV" ]; then
            echo "No rust-version set in Cargo.toml — skipping MSRV check."
            exit 0
          fi
          RUSTC_VERSION=$(rustc --version | awk '{print $2}')
          echo "Required MSRV: $MSRV"
          echo "Installed rustc: $RUSTC_VERSION"
          if printf '%s\n' "$MSRV" "$RUSTC_VERSION" | sort -V | head -n1 | grep -q "$MSRV"; then
            echo "MSRV check passed."
          else
            echo "::error::rustc $RUSTC_VERSION is below MSRV $MSRV"
            exit 1
          fi
      - name: Run tests
        run: cargo test --locked
      - name: Run tests (semantic feature)
        run: cargo test --workspace --locked --features semantic

  validate-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-on-failure: true
          key: validate-windows
      - name: Lint
        run: cargo clippy --locked -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Run tests (semantic feature)
        run: cargo test --workspace --locked --features semantic

  validate-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-on-failure: true
          key: validate-macos
      - name: Lint
        run: cargo clippy --locked -- -D warnings
      - name: Run tests
        run: cargo test --locked
      - name: Run tests (semantic feature)
        run: cargo test --workspace --locked --features semantic

  security-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            deps:
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'audit.toml'
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        if: steps.filter.outputs.deps == 'true' || github.event_name != 'pull_request'
      - name: Install cargo-audit (cached tool binary)
        if: steps.filter.outputs.deps == 'true' || github.event_name != 'pull_request'
        uses: taiki-e/install-action@43aecc8d72668fbcfe75c31400bc4f890f1c5853 # v2.83.2
        with:
          tool: cargo-audit
      - name: Run cargo audit
        if: steps.filter.outputs.deps == 'true' || github.event_name != 'pull_request'
        run: cargo audit
      - name: Skip audit (no dependency changes on PR)
        if: steps.filter.outputs.deps != 'true' && github.event_name == 'pull_request'
        run: echo "No Cargo.toml/Cargo.lock/audit.toml changes — skipping cargo audit on this PR."
