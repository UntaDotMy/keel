name: Release

# Artifact publish only — quality gate lives in validate.yml (not re-run here).
# Publish on:
#   - every main merge that touches product/code (bootstrap-*),
#   - version/bootstrap tags,
#   - manual workflow_dispatch.
# Docs-only main merges skip the multi-target release matrix.

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
      - "bootstrap-*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example v2026.03.15.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: "0"

jobs:
  # Decide whether this event should build/publish artifacts.
  changes:
    name: Release scope
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        # Only meaningful on branch pushes; tags/dispatch ignore the result.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          filters: |
            code:
              - 'rust/**'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'audit.toml'
              - '**/*.rs'
              - '.github/workflows/**'
              - 'install.sh'
              - 'install.ps1'
              - 'install.cmd'
              - '.claude-plugin/**'
              - '.claude/**'
              - 'commands/**'
              - 'opencode/**'
              - 'codex/**'
              - 'cursor/**'
              - 'pi/**'
              - 'cowork/**'
              - 'commandcode/**'
              - 'statusline/**'
              - 'hermes-agent/**'
              - '_shared/**'
              - 'using-keel/**'
              - '**/SKILL.md'
              - '**/agents/**'
              - 'AGENTS.md'
              - 'AGENTS/**'
              - 'CLAUDE.md'
              - 'Claude.md'
              - 'Agents.md'
              - '00-skill-routing-and-escalation.md'
              - 'WORKFLOW.md'
              - 'README.md'
              - 'templates/**'
              - '.githooks/**'
      - name: Decide whether to release
        id: decide
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Release: workflow_dispatch — always publish."
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Release: tag ${{ github.ref_name }} — always publish."
          elif [[ "${{ github.ref }}" == "refs/heads/main" && "${{ steps.filter.outputs.code }}" == "true" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Release: main push with product/code paths — publish bootstrap."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Release: skipped (docs-only or non-product main push)."
          fi

  release-preflight:
    name: Release preflight
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release-metadata.outputs.release_tag }}
      build_version: ${{ steps.release-metadata.outputs.build_version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      # Metadata only — no rustc needed for tag normalization.
      - name: Resolve release metadata
        id: release-metadata
        shell: bash
        run: |
          normalize_release_tag() {
            local raw=$1
            if [[ "$raw" == v* ]]; then
              printf '%s\n' "$raw"
              return 0
            fi
            if [[ "$raw" == [0-9]* ]]; then
              printf 'v%s\n' "$raw"
              return 0
            fi
            printf '%s\n' "$raw"
          }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="$(normalize_release_tag "${{ github.event.inputs.release_tag }}")"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="$(normalize_release_tag "${GITHUB_REF_NAME}")"
          else
            # Fallback for unexpected triggers; prefer explicit tag or dispatch input.
            release_tag="bootstrap-${GITHUB_SHA::12}"
          fi

          if [[ "$release_tag" == v[0-9]* ]]; then
            build_version="${release_tag#v}"
          else
            build_version="$release_tag"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: [changes, release-preflight]
    if: needs.changes.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            os_name: linux
            arch: amd64
            executable: keel
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            os_name: linux
            arch: arm64
            executable: keel
          - target: x86_64-apple-darwin
            os: macos-latest
            os_name: darwin
            arch: amd64
            executable: keel
          - target: aarch64-apple-darwin
            os: macos-latest
            os_name: darwin
            arch: arm64
            executable: keel
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            os_name: windows
            arch: amd64
            executable: keel.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            os_name: windows
            arch: arm64
            executable: keel.exe

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-on-failure: true
          key: release-${{ matrix.target }}
      - name: Install cross-compilation linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          # The `rusqlite` bundled feature compiles SQLite C source via the `cc`
          # crate, which needs an explicit cross-compiler when the host triple
          # differs from the target. The linker alone is not enough.
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"
      - name: Build
        env:
          RUSTFLAGS: -D warnings
          CLAUDE_SKILLS_BUILD_VERSION: ${{ needs.release-preflight.outputs.build_version }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage release bundle
        shell: bash
        run: |
          build_version="${{ needs.release-preflight.outputs.build_version }}"
          target_dir="dist/${{ matrix.os_name }}-${{ matrix.arch }}"
          mkdir -p "$target_dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "$target_dir/"
          cp *.md "$target_dir/" || true
          cp -R docs "$target_dir/docs" || true
          # Strip trailing slash from `*/` so cp -R preserves skill dir names
          # (else contents flatten into target root and install fails).
          skill_count=0
          for dir in */; do
            dir="${dir%/}"
            if [ -f "${dir}/SKILL.md" ]; then
              cp -R "$dir" "$target_dir/"
              skill_count=$((skill_count + 1))
            fi
          done
          # Stage cross-skill resource directories that SKILL.md files
          # reference via relative paths (for example _shared/common-discipline.md).
          # Mirrors SHARED_RESOURCE_DIRECTORIES in rust/.../runtime.rs — keep in
          # sync when adding new shared resource directories.
          for shared_dir in _shared; do
            if [ -d "$shared_dir" ]; then
              cp -R "$shared_dir" "$target_dir/"
            fi
          done
          # Stage custom slash commands so the native installer's
          # sync_commands step (manager/install.rs) finds a source directory.
          # Without this the release archive carries no commands/ dir, so a
          # fresh `keel install` registers zero /keel:*
          # commands — they would otherwise ship only via the plugin path.
          if [ -d commands ]; then
            cp -R commands "$target_dir/commands"
          fi
          # Stage the harness subagent definitions and the plugin manifest.
          # sync_subagent_definitions reads .claude/agents/*.md; without it a
          # fresh install registers none of the 24 delegation subagents.
          # .claude-plugin/ carries the plugin + MCP registration manifest so
          # the archive is self-describing for the plugin install path too.
          if [ -d .claude ]; then
            cp -R .claude "$target_dir/.claude"
          fi
          if [ -d .claude-plugin ]; then
            cp -R .claude-plugin "$target_dir/.claude-plugin"
          fi
          # Stage cross-agent adapter sources so install can wire non-Claude hosts.
          for adapter in opencode codex pi cursor cowork commandcode; do
            if [ -d "$adapter" ]; then
              cp -R "$adapter" "$target_dir/$adapter"
            fi
          done
          # Fail closed if staged layout cannot pass repository_layout_is_complete.
          missing=0
          for required in \
            AGENTS.md \
            README.md \
            00-skill-routing-and-escalation.md \
            reviewer/SKILL.md \
            "${{ matrix.executable }}"; do
            if [ ! -e "$target_dir/$required" ]; then
              echo "ERROR: staged release bundle is missing required path: $required" >&2
              missing=1
            fi
          done
          staged_skills="$(find "$target_dir" -mindepth 2 -maxdepth 2 -type f -name SKILL.md | wc -l | tr -d ' ')"
          if [ "$skill_count" -lt 1 ] || [ "$staged_skills" -lt 1 ]; then
            echo "ERROR: staged release bundle has no skill directories (skill_count=$skill_count staged_skills=$staged_skills)" >&2
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Staged bundle tree:" >&2
            find "$target_dir" -maxdepth 2 | sort >&2
            exit 1
          fi
          echo "Staged $skill_count skill directories ($staged_skills SKILL.md files) into $target_dir"
          cat > "$target_dir/keel-release-manifest.json" <<EOF
          {
            "package_kind": "packaged_release_bundle",
            "repository_slug": "${{ github.repository }}",
            "release_tag": "${{ needs.release-preflight.outputs.release_tag }}",
            "build_version": "${build_version}",
            "archive_file_name": "keel_${build_version}_${{ matrix.os_name }}_${{ matrix.arch }}.${{ matrix.os_name == 'windows' && 'zip' || 'tar.gz' }}"
          }
          EOF
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          build_version="${{ needs.release-preflight.outputs.build_version }}"
          cd "dist/${{ matrix.os_name }}-${{ matrix.arch }}"
          tar czf "../keel_${build_version}_${{ matrix.os_name }}_${{ matrix.arch }}.tar.gz" .
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          $build_version = "${{ needs.release-preflight.outputs.build_version }}"
          $source = "dist/${{ matrix.os_name }}-${{ matrix.arch }}"
          $dest = "dist/keel_${build_version}_${{ matrix.os_name }}_${{ matrix.arch }}.zip"
          Compress-Archive -Path "$source\*" -DestinationPath "$dest" -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.os_name }}-${{ matrix.arch }}
          path: dist/keel_${{ needs.release-preflight.outputs.build_version }}_${{ matrix.os_name }}_${{ matrix.arch }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - changes
      - release-preflight
      - build
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Create or update GitHub release
        shell: bash
        run: |
          release_tag="${{ needs.release-preflight.outputs.release_tag }}"
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" \
              --target "$GITHUB_SHA" \
              --title "$release_tag" \
              --generate-notes
          fi
      - name: Upload release assets
        shell: bash
        run: |
          gh release upload "${{ needs.release-preflight.outputs.release_tag }}" release-assets/* --clobber
