name: Release

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
      - "bootstrap-*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example v2026.03.15.0
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  release-preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release-metadata.outputs.release_tag }}
      build_version: ${{ steps.release-metadata.outputs.build_version }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt

      - name: Resolve release metadata
        id: release-metadata
        shell: bash
        run: |
          normalize_release_tag() {
            local raw=$1
            if [[ "$raw" == v* ]]; then
              printf '%s\n' "$raw"
              return 0
            fi
            if [[ "$raw" == [0-9]* ]]; then
              printf 'v%s\n' "$raw"
              return 0
            fi
            printf '%s\n' "$raw"
          }

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            release_tag="$(normalize_release_tag "${{ github.event.inputs.release_tag }}")"
          elif [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            release_tag="$(normalize_release_tag "${GITHUB_REF_NAME}")"
          else
            release_tag="bootstrap-${GITHUB_SHA::12}"
          fi

          if [[ "$release_tag" == v[0-9]* ]]; then
            build_version="${release_tag#v}"
          else
            build_version="$release_tag"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: release-preflight
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            os_name: linux
            arch: amd64
            executable: claude-skills
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            os_name: linux
            arch: arm64
            executable: claude-skills
          - target: x86_64-apple-darwin
            os: macos-latest
            os_name: darwin
            arch: amd64
            executable: claude-skills
          - target: aarch64-apple-darwin
            os: macos-latest
            os_name: darwin
            arch: arm64
            executable: claude-skills
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            os_name: windows
            arch: amd64
            executable: claude-skills.exe
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            os_name: windows
            arch: arm64
            executable: claude-skills.exe

    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - uses: actions-rust-lang/setup-rust-toolchain@46268bd060767258de96ed93c1251119784f2ab6 # v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@42dc69e1aa15d09112580998cf2ef0119e2e91ae # v2
        with:
          cache-on-failure: true
          key: release-${{ matrix.target }}
      - name: Install cross-compilation linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          # The `rusqlite` bundled feature compiles SQLite C source via the `cc`
          # crate, which needs an explicit cross-compiler when the host triple
          # differs from the target. The linker alone is not enough.
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"
      - name: Build
        env:
          RUSTFLAGS: -D warnings
          CLAUDE_SKILLS_BUILD_VERSION: ${{ needs.release-preflight.outputs.build_version }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage release bundle
        shell: bash
        run: |
          build_version="${{ needs.release-preflight.outputs.build_version }}"
          target_dir="dist/${{ matrix.os_name }}-${{ matrix.arch }}"
          mkdir -p "$target_dir"
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "$target_dir/"
          cp *.md "$target_dir/" || true
          cp -R docs "$target_dir/docs" || true
          for dir in */; do
            if [ -f "${dir}SKILL.md" ]; then
              cp -R "$dir" "$target_dir/"
            fi
          done
          # Stage cross-skill resource directories that SKILL.md files
          # reference via relative paths (for example _shared/common-discipline.md).
          # Mirrors SHARED_RESOURCE_DIRECTORIES in rust/.../runtime.rs — keep in
          # sync when adding new shared resource directories.
          for shared_dir in _shared; do
            if [ -d "$shared_dir" ]; then
              cp -R "$shared_dir" "$target_dir/"
            fi
          done
          # Stage custom slash commands so the native installer's
          # sync_commands step (manager/install.rs) finds a source directory.
          # Without this the release archive carries no commands/ dir, so a
          # fresh `claude-skills install` registers zero /claude-core:*
          # commands — they would otherwise ship only via the plugin path.
          if [ -d commands ]; then
            cp -R commands "$target_dir/commands"
          fi
          # Stage Claude Code subagent definitions and the plugin manifest.
          # sync_subagent_definitions reads .claude/agents/*.md; without it a
          # fresh install registers none of the 18 delegation subagents.
          # .claude-plugin/ carries the plugin + MCP registration manifest so
          # the archive is self-describing for the plugin install path too.
          if [ -d .claude ]; then
            cp -R .claude "$target_dir/.claude"
          fi
          if [ -d .claude-plugin ]; then
            cp -R .claude-plugin "$target_dir/.claude-plugin"
          fi
          cat > "$target_dir/claude-skills-release-manifest.json" <<EOF
          {
            "package_kind": "packaged_release_bundle",
            "repository_slug": "${{ github.repository }}",
            "release_tag": "${{ needs.release-preflight.outputs.release_tag }}",
            "build_version": "${build_version}",
            "archive_file_name": "claude-skills_${build_version}_${{ matrix.os_name }}_${{ matrix.arch }}.${{ matrix.os_name == 'windows' && 'zip' || 'tar.gz' }}"
          }
          EOF
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          build_version="${{ needs.release-preflight.outputs.build_version }}"
          cd "dist/${{ matrix.os_name }}-${{ matrix.arch }}"
          tar czf "../claude-skills_${build_version}_${{ matrix.os_name }}_${{ matrix.arch }}.tar.gz" .
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          $build_version = "${{ needs.release-preflight.outputs.build_version }}"
          $source = "dist/${{ matrix.os_name }}-${{ matrix.arch }}"
          $dest = "dist/claude-skills_${build_version}_${{ matrix.os_name }}_${{ matrix.arch }}.zip"
          Compress-Archive -Path "$source\*" -DestinationPath "$dest" -Force
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-${{ matrix.os_name }}-${{ matrix.arch }}
          path: dist/claude-skills_${{ needs.release-preflight.outputs.build_version }}_${{ matrix.os_name }}_${{ matrix.arch }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs:
      - release-preflight
      - build
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Create or update GitHub release
        shell: bash
        run: |
          release_tag="${{ needs.release-preflight.outputs.release_tag }}"
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" \
              --target "$GITHUB_SHA" \
              --title "$release_tag" \
              --generate-notes
          fi
      - name: Upload release assets
        shell: bash
        run: |
          gh release upload "${{ needs.release-preflight.outputs.release_tag }}" release-assets/* --clobber
