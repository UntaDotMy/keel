name: Release

# Artifact publish only — quality gate lives in validate.yml (not re-run here).
# Publish on:
#   - every main merge that touches product/code (bootstrap-*),
#   - version/bootstrap tags,
#   - manual workflow_dispatch.
# Docs-only main merges skip the multi-target release matrix.

on:
  push:
    branches:
      - "main"
    tags:
      - "v*"
      - "bootstrap-*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example v2026.03.15.0
        required: true
        type: string

permissions:
  actions: read
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings
  CARGO_INCREMENTAL: "0"

jobs:
  # Decide whether this event should build/publish artifacts.
  changes:
    name: Release scope
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.decide.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        # Only meaningful on branch pushes; tags/dispatch ignore the result.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          filters: |
            code:
              - 'rust/**'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - 'audit.toml'
              - '**/*.rs'
              - '.github/workflows/**'
              - 'install.sh'
              - 'install.ps1'
              - 'install.cmd'
              - '.claude-plugin/**'
              - '.claude/**'
              - 'commands/**'
              - 'opencode/**'
              - 'codex/**'
              - 'cursor/**'
              - 'pi/**'
              - 'cowork/**'
              - 'commandcode/**'
              - 'statusline/**'
              - 'hermes-agent/**'
              - '_shared/**'
              - 'using-keel/**'
              - '**/SKILL.md'
              - '**/agents/**'
              - 'AGENTS.md'
              - 'AGENTS/**'
              - 'CLAUDE.md'
              - 'Claude.md'
              - 'Agents.md'
              - '00-skill-routing-and-escalation.md'
              - 'WORKFLOW.md'
              - 'README.md'
              - 'templates/**'
              - '.githooks/**'
      - name: Decide whether to release
        id: decide
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Release: workflow_dispatch — always publish."
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Release: tag ${{ github.ref_name }} — always publish."
          elif [[ "${{ github.ref }}" == "refs/heads/main" && "${{ steps.filter.outputs.code }}" == "true" ]]; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Release: main push with product/code paths — publish bootstrap."
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
            echo "Release: skipped (docs-only or non-product main push)."
          fi

  release-preflight:
    name: Release preflight
    needs: changes
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release-metadata.outputs.release_tag }}
      build_version: ${{ steps.release-metadata.outputs.build_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
        with:
          fetch-depth: 0
      # Metadata only — no rustc needed for tag normalization.
      - name: Require exact-head validation
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          max_attempts=60
          for attempt in $(seq 1 "$max_attempts"); do
            latest="$(gh run list --workflow validate.yml --commit "$GITHUB_SHA" --limit 20 --json status,conclusion,headSha,databaseId \
              | jq -r --arg sha "$GITHUB_SHA" '[.[] | select(.headSha == $sha)] | sort_by(.databaseId) | last // empty | [.status, .conclusion, .databaseId] | @tsv')"
            if [[ -z "$latest" ]]; then
              echo "Validate has not reported HEAD $GITHUB_SHA (attempt $attempt/$max_attempts)."
            else
              IFS=$'\t' read -r status conclusion run_id <<<"$latest"
              if [[ "$status" == "completed" && "$conclusion" == "success" ]]; then
                echo "Validate run $run_id passed for exact HEAD $GITHUB_SHA."
                exit 0
              fi
              if [[ "$status" == "completed" ]]; then
                echo "::error::Validate run $run_id for HEAD $GITHUB_SHA concluded $conclusion."
                exit 1
              fi
              echo "Validate run $run_id is $status (attempt $attempt/$max_attempts)."
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for successful Validate evidence for exact HEAD $GITHUB_SHA."
          exit 1
      - name: Resolve release metadata
        id: release-metadata
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          HEAD_SHA: ${{ github.sha }}
          RELEASE_TAG_INPUT: ${{ inputs.release_tag }}
        run: |
          normalize_release_tag() {
            local raw=$1
            if [[ "$raw" == v* ]]; then
              printf '%s\n' "$raw"
              return 0
            fi
            if [[ "$raw" == [0-9]* ]]; then
              printf 'v%s\n' "$raw"
              return 0
            fi
            printf '%s\n' "$raw"
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            raw_release_tag="$RELEASE_TAG_INPUT"
          elif [[ "$REF_TYPE" == "tag" ]]; then
            raw_release_tag="$REF_NAME"
          else
            raw_release_tag="bootstrap-${HEAD_SHA::12}"
          fi

          release_tag="$(normalize_release_tag "$raw_release_tag")"
          if [[ ! "$release_tag" =~ ^v[0-9][A-Za-z0-9._-]*$ \
            && ! "$release_tag" =~ ^bootstrap-[0-9a-f]{12,64}$ ]]; then
            echo "::error::Invalid release tag: $release_tag" >&2
            exit 1
          fi

          if [[ "$release_tag" == v[0-9]* ]]; then
            build_version="${release_tag#v}"
          else
            build_version="$release_tag"
          fi

          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"
          echo "build_version=$build_version" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: [changes, release-preflight]
    if: needs.changes.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            os_name: linux
            arch: amd64
            executable: keel
            archive_extension: tar.gz
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            os_name: linux
            arch: arm64
            executable: keel
            archive_extension: tar.gz
          - target: x86_64-apple-darwin
            os: macos-latest
            os_name: darwin
            arch: amd64
            executable: keel
            archive_extension: tar.gz
          - target: aarch64-apple-darwin
            os: macos-latest
            os_name: darwin
            arch: arm64
            executable: keel
            archive_extension: tar.gz
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            os_name: windows
            arch: amd64
            executable: keel.exe
            archive_extension: zip
          - target: aarch64-pc-windows-msvc
            os: windows-latest
            os_name: windows
            arch: arm64
            executable: keel.exe
            archive_extension: zip

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # v1
        with:
          toolchain: stable
          target: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          cache-on-failure: true
          key: release-${{ matrix.target }}
      - name: Install cross-compilation linker
        if: matrix.target == 'aarch64-unknown-linux-gnu'
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          # The `rusqlite` bundled feature compiles SQLite C source via the `cc`
          # crate, which needs an explicit cross-compiler when the host triple
          # differs from the target. The linker alone is not enough.
          echo "CC_aarch64_unknown_linux_gnu=aarch64-linux-gnu-gcc" >> "$GITHUB_ENV"
          echo "AR_aarch64_unknown_linux_gnu=aarch64-linux-gnu-ar" >> "$GITHUB_ENV"
      - name: Build
        env:
          RUSTFLAGS: -D warnings
          CLAUDE_SKILLS_BUILD_VERSION: ${{ needs.release-preflight.outputs.build_version }}
        run: cargo build --release --target ${{ matrix.target }}
      - name: Stage release bundle
        shell: bash
        run: |
          set -euo pipefail
          build_version="${{ needs.release-preflight.outputs.build_version }}"
          target_dir="dist/${{ matrix.os_name }}-${{ matrix.arch }}"
          mkdir -p "$target_dir"
          skill_count=0
          for skill_dir in */; do
            if [ -f "${skill_dir}SKILL.md" ]; then
              skill_name="${skill_dir%/}"
              cp -R "$skill_dir" "$target_dir/$skill_name"
              skill_count=$((skill_count + 1))
            fi
          done
          cp "target/${{ matrix.target }}/release/${{ matrix.executable }}" "$target_dir/"
          cp *.md "$target_dir/" || true
          if [ -d docs ]; then
            cp -R docs "$target_dir/docs"
          fi
          # Stage cross-skill resource directories that SKILL.md files
          # reference via relative paths (for example _shared/common-discipline.md).
          # Mirrors SHARED_RESOURCE_DIRECTORIES in rust/.../runtime.rs — keep in
          # sync when adding new shared resource directories.
          for shared_dir in _shared; do
            if [ -d "$shared_dir" ]; then
              cp -R "$shared_dir" "$target_dir/"
            fi
          done
          # Stage custom slash commands so the native installer's
          # sync_commands step (manager/install.rs) finds a source directory.
          # Without this the release archive carries no commands/ dir, so a
          # fresh `keel install` registers zero /keel:*
          # commands — they would otherwise ship only via the plugin path.
          if [ -d commands ]; then
            cp -R commands "$target_dir/commands"
          fi
          # Stage the harness subagent definitions and the plugin manifest.
          # sync_subagent_definitions reads .claude/agents/*.md; without it a
          # fresh install registers none of the 24 delegation subagents.
          # .claude-plugin/ carries the plugin + MCP registration manifest so
          # the archive is self-describing for the plugin install path too.
          if [ -d .claude ]; then
            cp -R .claude "$target_dir/.claude"
          fi
          if [ -d .claude-plugin ]; then
            cp -R .claude-plugin "$target_dir/.claude-plugin"
          fi
          # Stage cross-agent adapter sources so install can wire non-Claude hosts.
          for adapter in opencode codex pi cursor cowork commandcode; do
            if [ -d "$adapter" ]; then
              cp -R "$adapter" "$target_dir/$adapter"
            fi
          done
          # Stage opt-in statusline scripts so manual statusLine configuration
          # works from the same release archive as the installed binary.
          if [ -d statusline ]; then
            cp -R statusline "$target_dir/statusline"
          fi
          # Fail closed if staged layout cannot pass repository_layout_is_complete.
          missing=0
          for required in \
            AGENTS.md \
            README.md \
            00-skill-routing-and-escalation.md \
            reviewer/SKILL.md \
            "${{ matrix.executable }}"; do
            if [ ! -e "$target_dir/$required" ]; then
              echo "ERROR: staged release bundle is missing required path: $required" >&2
              missing=1
            fi
          done
          staged_skills="$(find "$target_dir" -mindepth 2 -maxdepth 2 -type f -name SKILL.md | wc -l | tr -d ' ')"
          if [ "$skill_count" -lt 1 ] || [ "$staged_skills" -ne "$skill_count" ]; then
            echo "ERROR: staged skill count mismatch (source=$skill_count staged=$staged_skills)" >&2
            missing=1
          fi
          if [ "$missing" -ne 0 ]; then
            echo "Staged bundle tree:" >&2
            find "$target_dir" -maxdepth 2 | sort >&2
            exit 1
          fi
          echo "Staged $skill_count skill directories ($staged_skills SKILL.md files) into $target_dir"
          cat > "$target_dir/keel-release-manifest.json" <<EOF
          {
            "package_kind": "packaged_release_bundle",
            "repository_slug": "${{ github.repository }}",
            "release_tag": "${{ needs.release-preflight.outputs.release_tag }}",
            "build_version": "${build_version}",
          "archive_file_name": "keel_${build_version}_${{ matrix.os_name }}_${{ matrix.arch }}.${{ matrix.archive_extension }}"
          }
          EOF
      - name: Package (Unix)
        if: runner.os != 'Windows'
        run: |
          build_version="${{ needs.release-preflight.outputs.build_version }}"
          cd "dist/${{ matrix.os_name }}-${{ matrix.arch }}"
          tar czf "../keel_${build_version}_${{ matrix.os_name }}_${{ matrix.arch }}.tar.gz" .
      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          $build_version = "${{ needs.release-preflight.outputs.build_version }}"
          $source = "dist/${{ matrix.os_name }}-${{ matrix.arch }}"
          $dest = "dist/keel_${build_version}_${{ matrix.os_name }}_${{ matrix.arch }}.zip"
          Compress-Archive -Path "$source\*" -DestinationPath "$dest" -Force
      - name: Generate archive checksum (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          archive="dist/keel_${{ needs.release-preflight.outputs.build_version }}_${{ matrix.os_name }}_${{ matrix.arch }}.${{ matrix.archive_extension }}"
          sha256sum "$archive" > "$archive.sha256"
      - name: Generate archive checksum (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $archive = "dist/keel_${{ needs.release-preflight.outputs.build_version }}_${{ matrix.os_name }}_${{ matrix.arch }}.${{ matrix.archive_extension }}"
          $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $archive).Hash.ToLowerInvariant()
          "$hash  $(Split-Path -Leaf $archive)" | Set-Content -NoNewline "$archive.sha256"
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          path: dist/${{ matrix.os_name }}-${{ matrix.arch }}
          format: spdx-json
          output-file: dist/keel_${{ needs.release-preflight.outputs.build_version }}_${{ matrix.os_name }}_${{ matrix.arch }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Attest release archive
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4
        with:
          subject-path: dist/keel_${{ needs.release-preflight.outputs.build_version }}_${{ matrix.os_name }}_${{ matrix.arch }}.${{ matrix.archive_extension }}
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: release-${{ matrix.os_name }}-${{ matrix.arch }}
          path: dist/keel_${{ needs.release-preflight.outputs.build_version }}_${{ matrix.os_name }}_${{ matrix.arch }}.*
          if-no-files-found: error

  release-smoke:
    name: Smoke ${{ matrix.os_name }}-${{ matrix.arch }}
    needs: [changes, release-preflight, build]
    if: needs.changes.outputs.release == 'true'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            os_name: linux
            arch: amd64
          - os: macos-latest
            os_name: darwin
            arch: amd64
          - os: windows-latest
            os_name: windows
            arch: amd64
          - os: ubuntu-24.04-arm
            os_name: linux
            arch: arm64
          - os: macos-14
            os_name: darwin
            arch: arm64
          - os: windows-11-arm
            os_name: windows
            arch: arm64
    steps:
      - name: Download platform archive
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-${{ matrix.os_name }}-${{ matrix.arch }}
          merge-multiple: true
          path: artifact
      - name: Exercise Unix install path
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          bundle_root="$RUNNER_TEMP/keel-bundle"
          keel_home="$RUNNER_TEMP/keel-home/.keel"
          mkdir -p "$bundle_root" "$keel_home"
          archive="$(find artifact -maxdepth 1 -type f -name '*.tar.gz' -print -quit)"
          tar xzf "$archive" -C "$bundle_root"
          "$bundle_root/keel" install --repo-root "$bundle_root" --claude-home "$keel_home" --no-purge
          "$bundle_root/keel" status --repo-root "$bundle_root" --claude-home "$keel_home"
          "$bundle_root/keel" verify --repo-root "$bundle_root" --claude-home "$keel_home"
          "$bundle_root/keel" doctor --repo-root "$bundle_root" --claude-home "$keel_home"
      - name: Exercise Windows install path
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bundleRoot = Join-Path $env:RUNNER_TEMP "keel-bundle"
          $keelHome = Join-Path $env:RUNNER_TEMP "keel-home\.keel"
          New-Item -ItemType Directory -Force -Path $bundleRoot, $keelHome | Out-Null
          $archive = Get-ChildItem artifact -Filter "*.zip" | Select-Object -First 1
          Expand-Archive -Path $archive.FullName -DestinationPath $bundleRoot -Force
          $binary = Join-Path $bundleRoot "keel.exe"
          & $binary install --repo-root $bundleRoot --claude-home $keelHome --no-purge
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary status --repo-root $bundleRoot --claude-home $keelHome
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary verify --repo-root $bundleRoot --claude-home $keelHome
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $binary doctor --repo-root $bundleRoot --claude-home $keelHome
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  publish:
    name: Publish GitHub Release
    needs:
      - changes
      - release-preflight
      - build
      - release-smoke
    if: needs.changes.outputs.release == 'true'
    runs-on: ubuntu-latest
    env:
      GH_REPO: ${{ github.repository }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v5
      - name: Download all artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: release-*
          merge-multiple: true
          path: release-assets
      - name: Build release proof bundle
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          SOURCE_SHA: ${{ github.sha }}
          RELEASE_RUN_ID: ${{ github.run_id }}
          RELEASE_TAG: ${{ needs.release-preflight.outputs.release_tag }}
          BUILD_VERSION: ${{ needs.release-preflight.outputs.build_version }}
        run: |
          set -euo pipefail
          proof_root="release-proof"
          mkdir -p "$proof_root"

          validate_runs="${RUNNER_TEMP}/validate-runs.json"
          gh run list \
            --workflow validate.yml \
            --commit "$SOURCE_SHA" \
            --limit 20 \
            --json databaseId,status,conclusion,headSha \
            > "$validate_runs"
          validate_run_id="$(jq -r \
            --arg sha "$SOURCE_SHA" \
            '[.[] | select(.headSha == $sha and .status == "completed" and .conclusion == "success")] | sort_by(.databaseId) | last | .databaseId // empty' \
            "$validate_runs")"
          if [[ -z "$validate_run_id" ]]; then
            echo "No successful exact-head Validate run found for $SOURCE_SHA." >&2
            exit 1
          fi

          validate_url="https://github.com/${REPOSITORY}/actions/runs/${validate_run_id}"
          release_url="https://github.com/${REPOSITORY}/actions/runs/${RELEASE_RUN_ID}"
          cat > "$proof_root/validation-summary.md" <<EOF
          # Validation summary

          - Source commit: $SOURCE_SHA
          - Validate run: [$validate_run_id]($validate_url)
          - Release preflight required successful exact-head validation.
          - Locked Rust validation and platform matrix are defined in \`.github/workflows/validate.yml\`.
          EOF

          cat > "$proof_root/review-summary.md" <<EOF
          # Review summary

          - Source commit: $SOURCE_SHA
          - Review policy: native \`keel review pre-pr\` and strict closeout.
          - Review contract: \`docs/review-closeout.md\`.
          - Reviewed static baseline: \`review-closeout-baseline.json\`.
          - This file records the governing policy; it does not claim that a
            release job substituted for an independent review.
          EOF

          {
            echo "# Hosted check status"
            echo
            echo "- Release run: [$RELEASE_RUN_ID]($release_url)"
            echo "- Source commit: $SOURCE_SHA"
            echo
            echo "## Jobs"
            gh run view "$RELEASE_RUN_ID" --json jobs \
              --jq '.jobs[] | "- \(.name): \(.conclusion)"';
          } > "$proof_root/hosted-check-status.md"

          {
            echo "# Benchmark status snapshot"
            echo
            echo "- Source commit: $SOURCE_SHA"
            echo "- Snapshot source: \`docs/benchmark-scorecard.json\`"
            echo
            echo '```json'
            cat docs/benchmark-scorecard.json
            echo '```';
          } > "$proof_root/benchmark-status-snapshot.md"

          jq -n \
            --arg release_tag "$RELEASE_TAG" \
            --arg build_version "$BUILD_VERSION" \
            --arg source_sha "$SOURCE_SHA" \
            --arg release_run_id "$RELEASE_RUN_ID" \
            --arg validate_run_id "$validate_run_id" \
            --arg repository "$REPOSITORY" \
            --arg release_url "$release_url" \
            --arg validate_url "$validate_url" \
            '{
              schema_version: 1,
              repository: $repository,
              release_tag: $release_tag,
              build_version: $build_version,
              source_sha: $source_sha,
              release_run_id: $release_run_id,
              validate_run_id: $validate_run_id,
              release_workflow_url: $release_url,
              validate_workflow_url: $validate_url,
              proof_files: [
                "validation-summary.md",
                "review-summary.md",
                "hosted-check-status.md",
                "benchmark-status-snapshot.md",
                "release-proof-manifest.json"
              ]
            }' > "$proof_root/release-proof-manifest.json"

          for required in \
            validation-summary.md \
            review-summary.md \
            hosted-check-status.md \
            benchmark-status-snapshot.md \
            release-proof-manifest.json; do
            test -s "$proof_root/$required"
          done

          tar czf "release-assets/keel_release-proof_${BUILD_VERSION}.tar.gz" \
            -C "$proof_root" .
      - name: Stage verified installer scripts
        shell: bash
        run: |
          set -euo pipefail
          for installer in install.sh install.ps1 install.cmd; do
            cp "$installer" "release-assets/$installer"
            sha256sum "$installer" > "release-assets/$installer.sha256"
          done
      - name: Create or update GitHub release
        shell: bash
        run: |
          release_tag="${{ needs.release-preflight.outputs.release_tag }}"
          if ! gh release view "$release_tag" >/dev/null 2>&1; then
            gh release create "$release_tag" \
              --target "$GITHUB_SHA" \
              --title "$release_tag" \
              --generate-notes
          fi
      - name: Upload release assets
        shell: bash
        run: |
          gh release upload "${{ needs.release-preflight.outputs.release_tag }}" release-assets/* --clobber
