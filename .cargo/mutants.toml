# cargo-mutants configuration for Keel.
# Tests high-risk paths: proxy, MCP, planner, research, tickets, warnings, gates.

timeout = 60
test_tool = "cargo"
additional_cargo_args = ["--locked"]

examine_globs = [
    "rust/crates/keel/src/proxy/**/*.rs",
    "rust/crates/keel/src/mcp/**/*.rs",
    "rust/crates/keel/src/error.rs",
    "rust/crates/keel/src/utility/plan.rs",
    "rust/crates/keel/src/utility/research_policy.rs",
    "rust/crates/keel/src/utility/task_ticket.rs",
    "rust/crates/keel/src/utility/memory_families.rs",
    "rust/crates/keel/src/proxy/warnings.rs",
    "rust/crates/keel/src/review.rs",
    "rust/crates/keel/src/review/**/*.rs",
]

exclude_globs = [
    "**/tests/**",
    "**/test_*.rs",
    "**/fixtures/**",
]
